spring:
  application:
    name: product-management-availability-shred-g5ds
  profiles:
    active: dev
  
  datasource:
    url: jdbc:postgresql://localhost:5432/product_catalog_db
    username: ${DB_USERNAME:product_user}
    password: ${DB_PASSWORD:product_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
    open-in-view: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2000ms
    jedis:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 2000ms
  
  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false
  
  activemq:
    broker-url: ${JMS_BROKER_URL:tcp://localhost:61616}
    user: ${JMS_USERNAME:admin}
    password: ${JMS_PASSWORD:admin}
    pool:
      enabled: true
      max-connections: 50
      idle-timeout: 30000
    packages:
      trust-all: false
      trusted: ai.shreds.product_management_availability_shred_g5ds
  
  jms:
    template:
      default-destination: product.events
      delivery-delay: 0
      delivery-mode: persistent
      priority: 4
      time-to-live: 3600000
    listener:
      auto-startup: true
      acknowledge-mode: auto
      concurrency: 3-10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  level:
    ai.shreds.product_management_availability_shred_g5ds: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.springframework.cache: WARN
    org.springframework.jms: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    connection-timeout: 20000

product:
  availability:
    cache:
      ttl: 300
    sync:
      inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:8081/api/v1/inventory}
      poll-interval: 300000
      retry-attempts: 3
      circuit-breaker:
        failure-rate-threshold: 50
        wait-duration: 30000
        sliding-window-size: 10
  
  jms:
    queues:
      availability-changes: product.availability.changes
      seasonal-updates: seasonal.offerings.updates
      inventory-updates: inventory.status.updates
      product-restock: product.restock.notifications
      product-created: product.created
      product-updated: product.updated