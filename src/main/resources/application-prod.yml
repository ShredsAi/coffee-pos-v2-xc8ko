# Production configuration for Product Management & Availability Shred
# This configuration is optimized for production environments with enhanced security,
# performance monitoring, and robust error handling

spring:
  application:
    name: product-management-availability-shred-g5ds
  profiles:
    active: prod
  
  # Database configuration for production with connection pooling optimization
  datasource:
    url: jdbc:postgresql://${DB_HOST:prod-db-cluster.amazonaws.com}:${DB_PORT:5432}/${DB_NAME:product_catalog_prod}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
      pool-name: ProductCatalogHikariCP
  
  # JPA configuration optimized for production
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        generate_statistics: false
    open-in-view: false
  
  # Flyway configuration for production migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
  
  # Redis configuration for production cluster
  redis:
    host: ${REDIS_HOST:prod-redis-cluster.amazonaws.com}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    timeout: 5000ms
    ssl: ${REDIS_SSL:true}
    jedis:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 10
        max-wait: 5000ms
        test-on-borrow: true
        test-on-return: true
  
  # Cache configuration with longer TTL for production
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes
      cache-null-values: false
      key-prefix: "prod:product-catalog:"
      use-key-prefix: true
  
  # JMS configuration for production message broker
  activemq:
    broker-url: ${JMS_BROKER_URL:failover:(ssl://prod-mq-1.amazonaws.com:61617,ssl://prod-mq-2.amazonaws.com:61617)}
    user: ${JMS_USERNAME}
    password: ${JMS_PASSWORD}
    pool:
      enabled: true
      max-connections: 100
      idle-timeout: 30000
      expiry-timeout: 0
      time-between-expiration-check: -1
    packages:
      trust-all: false
      trusted: ai.shreds.product_management_availability_shred_g5ds
  
  # JMS template configuration for production
  jms:
    template:
      default-destination: product.events.prod
      delivery-delay: 0
      delivery-mode: persistent
      priority: 4
      time-to-live: 3600000
      receive-timeout: 5000
    listener:
      auto-startup: true
      acknowledge-mode: auto
      concurrency: 5-20
      max-concurrency: 20

# Management and monitoring configuration for production
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus,loggers
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:https://admin.coffeeshop.com}
        allowed-methods: GET,POST
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
    loggers:
      enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
    jms:
      enabled: true
    diskspace:
      enabled: true
      threshold: 10GB
  metrics:
    export:
      prometheus:
        enabled: true
        step: 30s
    tags:
      application: product-management-availability-shred
      environment: production
      version: ${app.version:1.0.0}

# Logging configuration for production
logging:
  level:
    root: WARN
    ai.shreds.product_management_availability_shred_g5ds: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    org.springframework.cache: WARN
    org.springframework.jms: WARN
    org.springframework.security: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n'
  file:
    name: /app/logs/product-management-availability-shred.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

# Server configuration for production
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  tomcat:
    max-threads: 300
    min-spare-threads: 20
    connection-timeout: 20000
    max-connections: 8192
    accept-count: 100
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  http2:
    enabled: true

# Product-specific configuration for production
product:
  availability:
    cache:
      ttl: 600  # 10 minutes for production
      max-entries: 10000
    sync:
      inventory-service-url: ${INVENTORY_SERVICE_URL:https://inventory-api.coffeeshop.com/api/v1/inventory}
      poll-interval: 300000  # 5 minutes
      retry-attempts: 5
      circuit-breaker:
        failure-rate-threshold: 30
        wait-duration: 60000
        sliding-window-size: 20
        minimum-number-of-calls: 10
      timeout: 30000
      read-timeout: 20000
      connection-timeout: 10000
  
  # JMS queue configuration for production
  jms:
    queues:
      availability-changes: product.availability.changes.prod
      seasonal-updates: seasonal.offerings.updates.prod
      inventory-updates: inventory.status.updates.prod
      product-restock: product.restock.notifications.prod
      product-created: product.created.prod
      product-updated: product.updated.prod
    dead-letter:
      enabled: true
      max-redeliveries: 3
      redelivery-delay: 30000

# Security configuration
security:
  require-ssl: true
  headers:
    frame-options: DENY
    content-type-options: nosniff
    xss-protection: 1; mode=block
    referrer-policy: strict-origin-when-cross-origin

# Application-specific configuration
app:
  version: ${APP_VERSION:1.0.0}
  environment: production
  features:
    circuit-breaker-enabled: true
    cache-enabled: true
    metrics-enabled: true
    audit-enabled: true
  rate-limiting:
    enabled: true
    requests-per-second: 100
    burst-capacity: 200

# External service configuration
external:
  inventory-service:
    base-url: ${INVENTORY_SERVICE_URL:https://inventory-api.coffeeshop.com}
    timeout: 30s
    retry:
      max-attempts: 3
      backoff-delay: 2s
      max-delay: 10s
    circuit-breaker:
      enabled: true
      failure-rate: 50
      slow-call-rate: 30
      slow-call-duration: 5s
      wait-duration: 30s