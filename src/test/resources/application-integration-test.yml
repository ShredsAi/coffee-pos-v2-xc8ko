spring:
  application:
    name: product-management-availability-shred-g5ds-integration-test
  profiles:
    active: integration-test
  
  datasource:
    # TestContainers will override these values dynamically
    url: jdbc:postgresql://localhost:5432/test_db
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 5000
      leak-detection-threshold: 30000
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
    open-in-view: false
  
  flyway:
    enabled: false # Disable for tests, use create-drop instead
  
  redis:
    # TestContainers will override these values dynamically
    host: localhost
    port: 6379
    password: 
    timeout: 1000ms
    jedis:
      pool:
        max-active: 8
        max-idle: 4
        min-idle: 2
        max-wait: 1000ms
  
  cache:
    type: redis
    redis:
      time-to-live: 30000
      cache-null-values: false
  
  activemq:
    # Will be overridden by embedded broker in test
    broker-url: vm://localhost?broker.persistent=false
    user: admin
    password: admin
    pool:
      enabled: true
      max-connections: 10
      idle-timeout: 10000
    packages:
      trust-all: true
  
  jms:
    template:
      default-destination: test.product.events
      delivery-delay: 0
      delivery-mode: non_persistent
      priority: 4
      time-to-live: 300000
    listener:
      auto-startup: true
      acknowledge-mode: auto
      concurrency: 1-2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  level:
    ai.shreds.product_management_availability_shred_g5ds: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.cache: DEBUG
    org.springframework.jms: INFO
    org.testcontainers: INFO
    root: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

server:
  port: 0 # Use random port for tests
  servlet:
    context-path: /api/v1

product:
  availability:
    cache:
      ttl: 30 # Shorter TTL for tests
    sync:
      inventory-service-url: http://localhost:8089/api/v1/inventory # WireMock URL
      poll-interval: 10000 # Shorter interval for tests
      retry-attempts: 2
      circuit-breaker:
        failure-rate-threshold: 50
        wait-duration: 5000
        sliding-window-size: 5
  
  jms:
    queues:
      availability-changes: test.product.availability.changes
      seasonal-updates: test.seasonal.offerings.updates
      inventory-updates: test.inventory.status.updates
      product-restock: test.product.restock.notifications
      product-created: test.product.created
      product-updated: test.product.updated